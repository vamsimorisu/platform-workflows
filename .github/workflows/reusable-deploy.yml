name: Reusable deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      runner_label:
        required: true
        type: string
      image_tag:
        required: false
        type: string
        default: ""
      aws_secret_id:
        required: true
        type: string
      image_name_backend:
        required: true
        type: string
      image_name_frontend:
        required: true
        type: string
      image_name_model:
        required: true
        type: string
      stutter_model_port:
        required: true
        type: string
      api_url:
        required: true
        type: string
      frontend_origin:
        required: true
        type: string
      backend_port:
        required: false
        type: string
        default: "8000"
      frontend_port:
        required: false
        type: string
        default: "3000"

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ${{ inputs.runner_label }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        working-directory: ./apps/api
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_NAME_BACKEND: ${{ inputs.image_name_backend }}
        run: |
          aws secretsmanager get-secret-value --secret-id "${{ inputs.aws_secret_id }}" --query SecretString --output text > .env
          docker build -t "${{ env.IMAGE_NAME_BACKEND }}:${{ env.IMAGE_TAG }}" . \
            || { echo "Docker build failed"; exit 1; }
          docker tag "${{ env.IMAGE_NAME_BACKEND }}:${{ env.IMAGE_TAG }}" "${{ env.IMAGE_NAME_BACKEND }}:latest"

      - name: Build stutter model image
        working-directory: ./apps/stutter-model
        env:
          IMAGE_NAME_MODEL: ${{ inputs.image_name_model }}
        run: |
          if docker build -t "${{ env.IMAGE_NAME_MODEL }}:${{ env.IMAGE_TAG }}" .; then
            docker tag "${{ env.IMAGE_NAME_MODEL }}:${{ env.IMAGE_TAG }}" "${{ env.IMAGE_NAME_MODEL }}:latest"
          else
            echo "::warning::The stutter model image did not build; the previous one stays in place."
          fi

      - name: Run stutter model container
        env:
          IMAGE_NAME_MODEL: ${{ inputs.image_name_model }}
          STUTTER_MODEL_PORT: ${{ inputs.stutter_model_port }}
        run: |
          if ! docker image inspect "${{ env.IMAGE_NAME_MODEL }}:${{ env.IMAGE_TAG }}" > /dev/null 2>&1; then
            echo "::warning::No new stutter model image; leaving the running one alone."
            exit 0
          fi
          docker rm -f "${{ env.IMAGE_NAME_MODEL }}" || true
          sleep 2
          docker run -d --name "${{ env.IMAGE_NAME_MODEL }}" --network host \
            --restart unless-stopped \
            -e PORT=${{ env.STUTTER_MODEL_PORT }} \
            "${{ env.IMAGE_NAME_MODEL }}:${{ env.IMAGE_TAG }}" \
            || echo "::warning::The stutter model container did not start."

      - name: Run backend container
        working-directory: ./apps/api
        env:
          IMAGE_NAME_BACKEND: ${{ inputs.image_name_backend }}
          FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
          MODEL_PORT: ${{ inputs.stutter_model_port }}
          BACKEND_PORT: ${{ inputs.backend_port }}
        run: |
          docker rm -f "${{ env.IMAGE_NAME_BACKEND }}" || true
          sleep 2
          docker run -d --name "${{ env.IMAGE_NAME_BACKEND }}" --network host \
            --env-file .env \
            -e PORT="${{ env.BACKEND_PORT }}" \
            -e ALLOWED_ORIGINS="${{ env.FRONTEND_ORIGIN }}" \
            -e STUTTER_MODEL_URL="http://localhost:${{ env.MODEL_PORT }}" \
            "${{ env.IMAGE_NAME_BACKEND }}:${{ env.IMAGE_TAG }}"

      - name: Build frontend image
        env:
          IMAGE_NAME_FRONTEND: ${{ inputs.image_name_frontend }}
          API_URL: ${{ inputs.api_url }}
        run: |
          docker build \
            -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="${{ env.API_URL }}" \
            -t "${{ env.IMAGE_NAME_FRONTEND }}:${{ env.IMAGE_TAG }}" . \
            || { echo "Docker build failed"; exit 1; }
          docker tag "${{ env.IMAGE_NAME_FRONTEND }}:${{ env.IMAGE_TAG }}" "${{ env.IMAGE_NAME_FRONTEND }}:latest"

      - name: Run frontend container
        env:
          IMAGE_NAME_FRONTEND: ${{ inputs.image_name_frontend }}
          FRONTEND_PORT: ${{ inputs.frontend_port }}
        run: |
          docker rm -f "${{ env.IMAGE_NAME_FRONTEND }}" || true
          docker run -d --name "${{ env.IMAGE_NAME_FRONTEND }}" -p "${{ env.FRONTEND_PORT }}:3000" \
            "${{ env.IMAGE_NAME_FRONTEND }}:${{ env.IMAGE_TAG }}"

      - name: Smoke check
        env:
          BACKEND_PORT: ${{ inputs.backend_port }}
          FRONTEND_PORT: ${{ inputs.frontend_port }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:${{ env.BACKEND_PORT }}/health/db" > /dev/null \
               && curl -fsS "http://localhost:${{ env.FRONTEND_PORT }}" > /dev/null; then
              echo "backend :${{ env.BACKEND_PORT }} (db reachable) and frontend :${{ env.FRONTEND_PORT }} are up"
              curl -fsS "http://localhost:${{ env.BACKEND_PORT }}/health/db"
              exit 0
            fi
            sleep 3
          done
          echo "Services did not come up, or the API could not reach the database"
          docker logs --tail 50 "${{ inputs.image_name_backend }}" || true
          docker logs --tail 50 "${{ inputs.image_name_frontend }}" || true
          exit 1

      - name: Stutter model check (warning only)
        env:
          MODEL_PORT: ${{ inputs.stutter_model_port }}
          IMAGE_NAME_MODEL: ${{ inputs.image_name_model }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ env.MODEL_PORT }}/health"; then
              echo "stutter model is up"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::The stutter model is not answering on :${{ env.MODEL_PORT }}. The backend runs without it; the audio model is left out of stuttering counts until it is up."
          docker logs --tail 50 "${{ env.IMAGE_NAME_MODEL }}" || true

      - name: Cleanup dangling images
        if: always()
        run: docker image prune -f || true
