name: Docker build

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: "Dockerfile"
      docker-context:
        type: string
        default: "."
    secrets:
      REGISTRY_USERNAME: { required: false }
      REGISTRY_PASSWORD: { required: false }
    outputs:
      digest:
        value: ${{ jobs.run.outputs.digest }}
  workflow_dispatch:
    inputs:
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      docker-context:
        required: false
        type: string
        default: "."

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}   # PRs build only; they never publish
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-context }}/${{ inputs.dockerfile }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        if: env.PUSH == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
