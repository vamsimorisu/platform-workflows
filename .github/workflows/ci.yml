name: CI (lint, test, build)

on:
  workflow_call:
    inputs:
      language:
        description: "python | node"
        type: string
        required: true
      language-version:
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
      package-manager:
        description: "node only: npm | pnpm | yarn"
        type: string
        default: "npm"
      lint-command:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      build-command:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      language:
        description: "python | node"
        required: true
        type: choice
        options: [python, node]
      language-version:
        required: false
        type: string
        default: ""
      working-directory:
        required: false
        type: string
        default: "."
      package-manager:
        description: "node only: npm | pnpm | yarn"
        required: false
        type: choice
        options: [npm, pnpm, yarn]
        default: npm
      lint-command:
        required: false
        type: string
        default: ""
      test-command:
        required: false
        type: string
        default: ""
      build-command:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # ---- Python ----
      - if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.language-version || '3.12' }}
      - if: inputs.language == 'python'
        name: Install (python)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
      - if: inputs.language == 'python'
        name: Lint (python)
        run: ${{ inputs.lint-command || 'pip install ruff && ruff check . && ruff format --check .' }}
      - if: inputs.language == 'python'
        name: Test (python)
        run: ${{ inputs.test-command || 'pip install pytest pytest-cov && pytest --cov --cov-report=xml' }}
      - if: inputs.language == 'python'
        name: Build verification (python)
        run: ${{ inputs.build-command || 'if [ -f pyproject.toml ]; then pip install build && python -m build; else python -m compileall -q .; fi' }}

      # ---- Node ----
      - if: inputs.language == 'node' && inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
      - if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.language-version || '22' }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/package-lock.json
            ${{ inputs.working-directory }}/pnpm-lock.yaml
            ${{ inputs.working-directory }}/yarn.lock
      - if: inputs.language == 'node'
        name: Install (node)
        run: |
          case "${{ inputs.package-manager }}" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
          esac
      - if: inputs.language == 'node'
        name: Lint (node)
        run: ${{ inputs.lint-command || format('{0} run lint --if-present', inputs.package-manager) }}
      - if: inputs.language == 'node'
        name: Test (node)
        run: ${{ inputs.test-command || format('{0} test --if-present', inputs.package-manager) }}
      - if: inputs.language == 'node'
        name: Build verification (node)
        run: ${{ inputs.build-command || format('{0} run build --if-present', inputs.package-manager) }}
