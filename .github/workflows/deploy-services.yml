name: Deploy Service

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (e.g. dev, prod)"
        required: true
        type: string
      runner_label:
        description: "Runner label to use"
        required: true
        type: string
      image_tag:
        description: "Optional image tag (defaults to commit SHA)"
        required: false
        type: string
      aws_secret_id:
        description: "AWS Secrets Manager secret ID for backend env"
        required: true
        type: string
      image_name_backend:
        description: "Docker image/container name for backend"
        required: true
        type: string
      image_name_frontend:
        description: "Docker image/container name for frontend"
        required: true
        type: string
      frontend_origin:
        description: "Allowed CORS origin for backend"
        required: true
        type: string
      api_url:
        description: "API URL for frontend build"
        required: true
        type: string
      backend_port:
        description: "Host port for backend service (must be unique per repo on the runner)"
        required: true
        type: number
      frontend_port:
        description: "Host port for frontend service (must be unique per repo on the runner)"
        required: true
        type: number

concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ${{ inputs.runner_label }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
      IMAGE_NAME_BACKEND: ${{ inputs.image_name_backend }}
      IMAGE_NAME_FRONTEND: ${{ inputs.image_name_frontend }}
      BACKEND_PORT: ${{ inputs.backend_port }}
      FRONTEND_PORT: ${{ inputs.frontend_port }}
      FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
      API_URL: ${{ inputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        working-directory: ./apps/api
        run: |
          aws secretsmanager get-secret-value --secret-id "${{ inputs.aws_secret_id }}" --query SecretString --output text > .env
          docker build -t "$IMAGE_NAME_BACKEND:$IMAGE_TAG" . \
            || { echo "Docker build failed"; exit 1; }
          docker tag "$IMAGE_NAME_BACKEND:$IMAGE_TAG" "$IMAGE_NAME_BACKEND:latest"

      - name: Run backend container
        working-directory: ./apps/api
        run: |
          docker rm -f "$IMAGE_NAME_BACKEND" || true
          sleep 2
          docker run -d --name "$IMAGE_NAME_BACKEND" --network host \
            --env-file .env \
            -e PORT="$BACKEND_PORT" \
            -e ALLOWED_ORIGINS="$FRONTEND_ORIGIN" \
            "$IMAGE_NAME_BACKEND:$IMAGE_TAG"

      - name: Build frontend image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
            -t "$IMAGE_NAME_FRONTEND:$IMAGE_TAG" . \
            || { echo "Docker build failed"; exit 1; }
          docker tag "$IMAGE_NAME_FRONTEND:$IMAGE_TAG" "$IMAGE_NAME_FRONTEND:latest"

      - name: Run frontend container
        run: |
          docker rm -f "$IMAGE_NAME_FRONTEND" || true
          docker run -d --name "$IMAGE_NAME_FRONTEND" -p "$FRONTEND_PORT:3000" \
            "$IMAGE_NAME_FRONTEND:$IMAGE_TAG"

      - name: Smoke check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:$BACKEND_PORT/health/db" > /dev/null \
              && curl -fsS "http://localhost:$FRONTEND_PORT" > /dev/null; then
              echo "backend :$BACKEND_PORT (db reachable) and frontend :$FRONTEND_PORT are up"
              curl -fsS "http://localhost:$BACKEND_PORT/health/db"
              exit 0
            fi
            sleep 3
          done
          echo "Services did not come up, or the API could not reach the database"
          docker logs --tail 50 "$IMAGE_NAME_BACKEND" || true
          docker logs --tail 50 "$IMAGE_NAME_FRONTEND" || true
          exit 1

      - name: Cleanup dangling images
        if: always()
        run: docker image prune -f || true
